[project]
name = "dg"
version = "0.1.0"
description = "Hierarchical dependency-graph task tracker for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nitish Pandey", email = "nitishpandey2117@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["ai-agents", "task-tracker", "dependency-graph", "dag", "planning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/nitishpandey04/dg"
dependencies = []

[project.scripts]
dg = "dg:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
